<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhatsApp Pairing & Groups</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
  body {
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    min-height: 100vh; color: #fff; padding: 20px;
    display: flex; justify-content: center; align-items: flex-start;
  }
  .container {
    width: 100%; max-width: 900px;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px; padding: 30px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  h1 {
    text-align: center; font-size: 26px; margin-bottom: 25px;
    background: linear-gradient(90deg, #25D366, #128C7E);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  h1 i { -webkit-text-fill-color: #25D366; margin-right: 8px; }
  .section {
    background: rgba(0,0,0,0.25); border-radius: 15px;
    padding: 20px; margin-bottom: 20px;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .section-title {
    font-size: 16px; margin-bottom: 15px; color: #25D366;
    display: flex; align-items: center; gap: 8px;
  }
  input {
    width: 100%; padding: 12px 15px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(0,0,0,0.3); color: #fff; font-size: 15px;
    outline: none; margin-bottom: 12px; transition: 0.3s;
  }
  input:focus { border-color: #25D366; box-shadow: 0 0 0 3px rgba(37,211,102,0.15); }
  button {
    width: 100%; padding: 12px; border: none; border-radius: 10px;
    background: linear-gradient(90deg, #25D366, #128C7E);
    color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: 0.3s; display: flex; align-items: center;
    justify-content: center; gap: 8px;
  }
  button:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(37,211,102,0.3); }
  button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
  .code-box {
    margin-top: 15px; padding: 15px;
    background: rgba(37,211,102,0.1);
    border: 1px dashed #25D366; border-radius: 10px;
    text-align: center; display: none;
  }
  .code-box.show { display: block; animation: fadeIn 0.4s ease; }
  .code-value {
    font-size: 28px; font-weight: bold; letter-spacing: 4px;
    color: #25D366; margin: 8px 0; font-family: monospace;
  }
  .code-label { font-size: 13px; color: #aaa; }
  .session-id { font-size: 11px; color: #888; word-break: break-all; margin-top: 8px; }
  .status { font-size: 13px; margin-top: 10px; display: flex; align-items: center; gap: 6px; justify-content: center; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #ff4444; display: inline-block; }
  .dot.connected { background: #25D366; animation: pulse 1.5s infinite; }
  .dot.waiting { background: #ffaa00; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.4;} }
  @keyframes fadeIn { from{opacity:0;transform:translateY(-8px);} to{opacity:1;transform:translateY(0);} }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
  th, td { padding: 10px 8px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.08); }
  th { background: rgba(37,211,102,0.15); color: #25D366; font-weight: 600; font-size: 12px; text-transform: uppercase; }
  tr:hover td { background: rgba(255,255,255,0.03); }
  .uid { font-family: monospace; color: #25D366; font-size: 12px; word-break: break-all; }
  .empty { text-align: center; padding: 20px; color: #888; font-size: 14px; }
  .spinner {
    border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid #25D366;
    border-radius: 50%; width: 18px; height: 18px; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .toast {
    position: fixed; bottom: 25px; left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: #222; color: #fff; padding: 12px 22px; border-radius: 10px;
    border-left: 4px solid #25D366; font-size: 14px;
    opacity: 0; transition: 0.3s; z-index: 999;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.error { border-left-color: #ff4444; }
  .error-msg {
    margin-top: 10px; padding: 10px; border-radius: 8px;
    background: rgba(255,68,68,0.15); border: 1px solid #ff4444;
    color: #ffaaaa; font-size: 13px; display: none;
  }
  .error-msg.show { display: block; }
</style>
</head>
<body>

<div class="container">
  <h1><i class="fab fa-whatsapp"></i> WhatsApp Pairing & Groups</h1>

  <div class="section">
    <div class="section-title"><i class="fas fa-key"></i> Step 1: Generate Pairing Code</div>
    <input type="tel" id="phoneNumber" placeholder="Country code ke saath number (e.g. 923001234567)">
    <button id="pairBtn" onclick="generatePairingCode()">
      <i class="fas fa-qrcode"></i> Generate Pairing Code
    </button>

    <div class="code-box" id="codeBox">
      <div class="code-label">Your Pairing Code</div>
      <div class="code-value" id="pairingCode">⏳</div>
      <div class="status">
        <span class="dot waiting" id="statusDot"></span>
        <span id="statusText">Code generate ho raha hai...</span>
      </div>
      <div class="session-id">Session: <span id="sessionIdText">-</span></div>
    </div>
    <div class="error-msg" id="errorMsg"></div>
  </div>

  <div class="section">
    <div class="section-title"><i class="fas fa-users"></i> Step 2: Your Groups & UIDs</div>
    <button id="groupsBtn" onclick="fetchGroups()" disabled>
      <i class="fas fa-sync-alt"></i> Load Groups
    </button>
    <div id="groupsContainer">
      <div class="empty"><i class="fas fa-info-circle"></i> Pehle pairing code se WhatsApp connect karo.</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let currentSessionId = null;
let statusInterval = null;
let groupsInterval = null;
let codePolling = null;

function showToast(msg, isError = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(() => t.className = 'toast' + (isError ? ' error' : ''), 3000);
}

function showError(msg) {
  const e = document.getElementById('errorMsg');
  e.textContent = msg;
  e.classList.add('show');
}

function hideError() {
  document.getElementById('errorMsg').classList.remove('show');
}

// ---------- Step 1 ----------
async function generatePairingCode() {
  const num = document.getElementById('phoneNumber').value.trim();
  if (!num) return showToast('Phone number daalo!', true);

  hideError();

  const btn = document.getElementById('pairBtn');
  btn.disabled = true;
  btn.innerHTML = '<div class="spinner"></div> Generating...';

  // Reset UI
  document.getElementById('pairingCode').textContent = '⏳';
  document.getElementById('codeBox').classList.remove('show');
  document.getElementById('codeBox').classList.add('show');
  document.getElementById('statusText').textContent = 'Code generate ho raha hai...';
  document.getElementById('statusDot').className = 'dot waiting';
  document.getElementById('groupsBtn').disabled = true;

  try {
    const res = await fetch('/generate-pairing-code', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ number: num })
    });
    const data = await res.json();

    if (!data.success) {
      showError(data.error || 'Failed');
      showToast(data.error || 'Failed', true);
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-qrcode"></i> Generate Pairing Code';
      return;
    }

    currentSessionId = data.sessionId;
    document.getElementById('sessionIdText').textContent = data.sessionId;

    showToast('Code ban raha hai, 5-10 second wait karo...');

    // Poll for pairing code
    if (codePolling) clearInterval(codePolling);
    codePolling = setInterval(pollPairingCode, 1500);

    // Also start connection status polling
    startStatusPolling();

  } catch (err) {
    showError('Error: ' + err.message);
    showToast('Error: ' + err.message, true);
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-qrcode"></i> Generate Pairing Code';
  }
}

async function pollPairingCode() {
  if (!currentSessionId) return;

  try {
    const res = await fetch(`/pairing-code-status?sessionId=${currentSessionId}`);
    const data = await res.json();

    if (!data.success) return;

    if (data.pairingCode) {
      document.getElementById('pairingCode').textContent = data.pairingCode;
      document.getElementById('statusText').textContent = 'WhatsApp mein code enter karo';
      document.getElementById('statusDot').className = 'dot waiting';
      clearInterval(codePolling);
      codePolling = null;
    } else if (data.pairingCodeError) {
      showError('Pairing code error: ' + data.pairingCodeError);
      document.getElementById('pairingCode').textContent = '✖';
      document.getElementById('statusText').textContent = 'Code generate nahi hua';
      document.getElementById('statusDot').className = 'dot';
      clearInterval(codePolling);
      codePolling = null;
    }
  } catch (e) { /* ignore */ }
}

// ---------- Connection status polling ----------
function startStatusPolling() {
  if (statusInterval) clearInterval(statusInterval);

  statusInterval = setInterval(async () => {
    if (!currentSessionId) return;
    try {
      const res = await fetch(`/session-status?sessionId=${currentSessionId}`);
      const data = await res.json();
      if (!data.success) return;

      const dot = document.getElementById('statusDot');
      const txt = document.getElementById('statusText');
      const groupsBtn = document.getElementById('groupsBtn');

      if (data.isConnected) {
        dot.className = 'dot connected';
        txt.textContent = '✅ Connected to WhatsApp';
        groupsBtn.disabled = false;

        if (!groupsInterval) {
          fetchGroups();
          groupsInterval = setInterval(fetchGroups, 15000);
        }
      }
    } catch (e) { /* ignore */ }
  }, 3000);
}

// ---------- Step 2 ----------
async function fetchGroups() {
  if (!currentSessionId) return showToast('Pehle pairing karo!', true);

  const btn = document.getElementById('groupsBtn');
  const originalHtml = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<div class="spinner"></div> Loading...';

  try {
    const res = await fetch(`/get-groups?sessionId=${currentSessionId}`);
    const data = await res.json();
    const container = document.getElementById('groupsContainer');

    if (!data.success) {
      container.innerHTML = `<div class="empty"><i class="fas fa-exclamation-triangle"></i> ${data.error || 'Failed'}</div>`;
      btn.disabled = false; btn.innerHTML = originalHtml;
      return;
    }

    if (!data.groups || data.groups.length === 0) {
      container.innerHTML = `<div class="empty"><i class="fas fa-info-circle"></i> Koi group nahi mila.</div>`;
      btn.disabled = false; btn.innerHTML = originalHtml;
      return;
    }

    let html = `
      <div style="margin-top:12px; font-size:13px; color:#aaa;">
        Total Groups: <b style="color:#25D366;">${data.groups.length}</b> | Number: <b style="color:#25D366;">${data.number}</b>
      </div>
      <div style="overflow-x:auto;">
      <table>
        <thead><tr><th>#</th><th>Group Name</th><th>Group UID</th><th>Members</th><th>Created</th></tr></thead>
        <tbody>`;

    data.groups.forEach(g => {
      html += `
        <tr>
          <td>${g.index}</td>
          <td>${escapeHtml(g.subject)}</td>
          <td class="uid">${g.groupId}</td>
          <td>${g.participantsCount}</td>
          <td>${g.creation || '-'}</td>
        </tr>`;
    });

    html += `</tbody></table></div>`;
    container.innerHTML = html;
    btn.disabled = false; btn.innerHTML = originalHtml;

  } catch (err) {
    showToast('Error: ' + err.message, true);
    btn.disabled = false; btn.innerHTML = originalHtml;
  }
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, m => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[m]));
}
</script>
</body>
</html>
